{% extends "admin/base.html" %}
{% load static %}

{% block extrastyle %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        /* Admin-specific overrides */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        
        #header {
            background-color: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
        }
        
        #header h1, #header h1 a {
            color: var(--text-color);
        }
        
        #header a {
            color: var(--primary-color);
        }
        
        #header a:hover {
            color: var(--primary-hover);
        }
        
        #content {
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }
        
        .module {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        
        .module h2 {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 14px 16px;
            margin: 0;
            border-radius: 8px 8px 0 0;
        }
        
        .module table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background-color: var(--card-bg);
            margin: 0;
        }
        
        .module th {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-color);
        }
        
        .module td {
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            color: var(--text-color);
        }
        
        .module tbody tr:hover {
            background-color: rgba(59, 130, 246, 0.05);
        }
        
        .module tbody tr:last-child td {
            border-bottom: 1px solid var(--border-color);
        }
        
        input[type="text"], input[type="password"], input[type="email"], 
        input[type="number"], input[type="search"], textarea, select {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            font-family: inherit;
        }
        
        input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus,
        input[type="number"]:focus, input[type="search"]:focus, textarea:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            outline: none;
        }
        
        input[type="submit"], input[type="button"], button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }
        
        input[type="submit"]:hover, input[type="button"]:hover, button:hover {
            background-color: var(--primary-hover);
        }
        
        .submit-row {
            background-color: transparent;
            border-top: 1px solid var(--border-color);
            padding: 15px 16px;
        }
        
        .submit-row input, .submit-row a {
            margin-right: 10px;
        }
        
        .submit-row a.button {
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            display: inline-block;
            transition: var(--transition);
        }
        
        .submit-row a.button:hover {
            background-color: var(--primary-hover);
            text-decoration: none;
        }
        
        .submit-row a.deletelink {
            background-color: var(--danger-color);
            color: white;
        }
        
        .submit-row a.deletelink:hover {
            background-color: #dc2626;
            text-decoration: none;
        }
        
        a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
        
        .breadcrumbs {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 16px;
            margin-bottom: 20px;
            color: var(--text-color);
        }
        
        .breadcrumbs a {
            color: var(--primary-color);
        }
        
        .errornote, .messagelist {
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 12px 16px;
        }
        
        .errorlist {
            background-color: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-color);
            border-radius: 6px;
            padding: 10px;
            margin: 10px 0;
        }
        
        .errorlist li {
            list-style-type: none;
            padding: 5px 0;
        }
        
        .delete-confirmation {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        
        #footer {
            background-color: var(--nav-bg);
            border-top: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 15px 20px;
        }
        
        #footer a {
            color: var(--primary-color);
        }
        
        #footer a:hover {
            color: var(--primary-hover);
        }
    </style>
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
{% endblock %}

{% block branding %}
    <div class="nav">
        <div style="display: flex; align-items: center; gap: 20px;">
            <h1 id="site-name"><a href="{% url 'admin:index' %}">{{ site_header }}</a></h1>
            <div style="display: flex; gap: 10px; font-size: 14px;">
                <a href="/">Voltar para Produtos</a> | 
                <a href="/fornecedores/">Fornecedores</a>
            </div>
        </div>
        <button id="theme-toggle" class="theme-toggle-switch" aria-label="Alternar tema escuro/claro">
            <span class="switch-text day-text">Day Mode</span>
            <span class="switch-text night-text">Night Mode</span>
            <div class="switch-thumb">
                <div class="icon-sun">
                    <svg viewBox="0 0 24 24" width="22" height="22">
                        <circle cx="12" cy="12" r="6" fill="#f59e0b" />
                        <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </div>
                <div class="icon-moon">
                    <svg viewBox="0 0 24 24" width="22" height="22">
                        <circle cx="12" cy="12" r="10" fill="#1e293b" />
                        <path d="M12 3a9 9 0 1 0 9 9 9.75 9.75 0 0 0-.67-3.5 6.75 6.75 0 0 1-8.33-8.33A9.75 9.75 0 0 0 12 3z" fill="#ffffff" />
                        <path d="M19 5.5l.6 1.2 1.3.2-1 .9.2 1.3-1.1-.6-1.1.6.2-1.3-1-.9 1.3-.2.6-1.2z" fill="#ffffff" />
                    </svg>
                </div>
            </div>
        </button>
    </div>
    <style>
        #branding {
            background-color: transparent;
            padding: 0;
            border-bottom: none;
        }
    </style>
{% endblock %}

{% block extrahead %}
    <script src="{% static 'js/main.js' %}"></script>
{% endblock %}
