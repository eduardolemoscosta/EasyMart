{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EasyMart{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <header>
        <div class="nav">
            <div>
                <a href="/fornecedores/">Fornecedores</a> | <a href="/admin/">Painel Admin</a>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer style="margin-top: 32px; padding: 16px 0; text-align: center; color: var(--text-muted);">
        <div>© {{ now|date:"Y" }} EasyMart — Sistema de Gerenciamento</div>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
