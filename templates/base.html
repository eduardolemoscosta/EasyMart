{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EasyMart{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>
<body>
    <header>
        <div class="nav">
            <div>
                <a href="/fornecedores/">Fornecedores</a> | <a href="/admin/">Painel Admin</a>
            </div>
            <button id="theme-toggle" class="theme-toggle-switch" aria-label="Alternar tema escuro/claro">
                <span class="switch-text day-text">Day Mode</span>
                <span class="switch-text night-text">Night Mode</span>
                <div class="switch-thumb">
                    <div class="icon-sun">
                        <svg viewBox="0 0 24 24" width="22" height="22">
                            <circle cx="12" cy="12" r="6" fill="#f59e0b" />
                            <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="icon-moon">
                        <svg viewBox="0 0 24 24" width="22" height="22">
                            <circle cx="12" cy="12" r="10" fill="#1e293b" />
                            <path d="M12 3a9 9 0 1 0 9 9 9.75 9.75 0 0 0-.67-3.5 6.75 6.75 0 0 1-8.33-8.33A9.75 9.75 0 0 0 12 3z" fill="#ffffff" />
                            <path d="M19 5.5l.6 1.2 1.3.2-1 .9.2 1.3-1.1-.6-1.1.6.2-1.3-1-.9 1.3-.2.6-1.2z" fill="#ffffff" />
                        </svg>
                    </div>
                </div>
            </button>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer style="margin-top: 32px; padding: 16px 0; text-align: center; color: var(--text-muted);">
        <div>© {{ now|date:"Y" }} EasyMart — Sistema de Gerenciamento</div>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
